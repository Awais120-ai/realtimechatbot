[project]
name = "realtime-chat-backend"
version = "0.1.0"
description = "Enterprise FastAPI Real-Time Chat Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "celery",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "websockets",
    "cloudinary"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
