version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dev_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: dev_redis
    ports:
      - "6379:6379"
